# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained (archived), not vulnerable. It is a build-time
    # macro dependency of nalgebra via simba; revisit when nalgebra drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, no known vulnerability; transitive via nalgebra" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    # Weak, file-level copyleft, and it reaches the shipped binary: `colored`
    # and `option-ext` arrive through hf-hub -> hf-xet -> xet-runtime, and
    # hf-hub 1.0 has no feature that drops Xet support. Neither crate is
    # modified here, so the obligation is to say that the binary contains
    # MPL-2.0 code and where its source is -- which the CLI README does, under
    # "Licences". Allowed with that disclosure, not because it is harmless.
    "MPL-2.0",
    # The root certificate list in webpki-root-certs, which is data rather
    # than code. CDLA-Permissive-2.0 is permissive and imposes no condition on
    # redistributing it.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

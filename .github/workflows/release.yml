name: Release

# Builds the Rust desktop application and attaches the installers to a tag.
#
# This replaces a workflow that built a Python wheel, a PyInstaller sidecar and
# a React bundle, all of which have been removed. It has not been executed: it
# only runs on a tag push, so the first real tag is also its first test. The
# build steps mirror the `desktop-app` job in ci.yml, which does run on every
# commit, so the Rust and Trunk parts are exercised there — the parts unique to
# this file are `cargo tauri build` and the artifact collection.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  desktop-build:
    name: Desktop installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact-name: desktop-macos
          - platform: ubuntu-22.04
            artifact-name: desktop-linux
          - platform: windows-latest
            artifact-name: desktop-windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: System packages (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - uses: jetli/trunk-action@v0.5.1
        with:
          version: v0.22.1

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      # The structure viewer's assets are fetched rather than vendored, and
      # the UI build expects them to be present.
      - name: Fetch Mol* assets
        working-directory: app
        run: cargo run -p xtask -- fetch-molstar

      # tauri.conf.json runs `trunk build --release` in app/ui as its
      # beforeBuildCommand, so the WebAssembly front end is built here too.
      - name: Build the application
        working-directory: app/desktop
        run: cargo tauri build

      - name: Collect installers
        if: always()
        shell: bash
        run: |
          mkdir -p installers
          find app/target/release/bundle -type f \( \
            -name "*.dmg" -o \
            -name "*.app.tar.gz" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.AppImage" -o \
            -name "*.msi" -o \
            -name "*-setup.exe" \
          \) -exec cp {} installers/ \;
          ls -la installers/

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: installers/*
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [desktop-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: true
          generate_release_notes: true
          body: |
            ## Installing

            Download the installer for your platform below. There is no Python
            or Node runtime to install, and the application does not open a
            network port.

            | Platform | File |
            |---|---|
            | Windows | `*-setup.exe` or `*.msi` |
            | macOS | `*.dmg` |
            | Linux | `*.AppImage`, `*.deb` or `*.rpm` |

            ## Predictions need the trained heads

            The application ships without model weights. Download them and
            point `OPENDNA_MODELS` at the directory:

            ```bash
            hf download dyber-pqc/opendna-stability --local-dir models
            hf download dyber-pqc/opendna-solubility --local-dir models
            hf download dyber-pqc/opendna-disorder --local-dir models
            ```

            The first prediction also downloads the ESM-2 embedding model, a
            few hundred megabytes, after which it works offline. Without a
            head installed the application reports the prediction as
            unavailable; it does not estimate the value some other way.

            Each head's accuracy, baseline and limitations are on its model
            card. Read them before acting on a number.

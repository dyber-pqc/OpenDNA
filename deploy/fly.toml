# Fly.io deployment for OpenDNA web demo.
#
# Deploy with:
#   flyctl launch --copy-config --no-deploy
#   flyctl volumes create opendna_data --size 50 --region iad
#   flyctl secrets set OPENDNA_AUTH_REQUIRED=0 OPENDNA_PUBLIC_DEMO=1
#   flyctl deploy
#
# Note: GPU-capable machines must be provisioned separately (flyctl scale vm a100-40gb).

app = "opendna"
primary_region = "iad"
kill_signal  = "SIGTERM"
kill_timeout = "30s"

[build]
  image = "opendna/server:latest"

[env]
  OPENDNA_HOST = "0.0.0.0"
  OPENDNA_PORT = "8765"
  HF_HOME = "/data/hf"
  OPENDNA_PUBLIC_DEMO = "1"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 40
    soft_limit = 20

[[mounts]]
  source = "opendna_data"
  destination = "/data"

[[vm]]
  cpu_kind = "performance"
  cpus = 8
  memory_mb = 16384

[checks.health]
  type = "http"
  interval = "30s"
  timeout = "10s"
  grace_period = "60s"
  method = "GET"
  path = "/health"

version: "3.9"

# OpenDNA public web demo stack.
#
# Services:
#   opendna - the Python FastAPI server (bind to the opendna image/tag you build)
#   caddy   - reverse proxy with automatic HTTPS via Let's Encrypt
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#
# Environment:
#   OPENDNA_AUTH_REQUIRED=1 to force PQC-token auth on every request
#   OPENDNA_PUBLIC_DEMO=1   relaxed limits + demo banner

services:
  opendna:
    image: opendna/server:latest
    container_name: opendna
    restart: unless-stopped
    environment:
      - OPENDNA_HOST=0.0.0.0
      - OPENDNA_PORT=8765
      - OPENDNA_AUTH_REQUIRED=${OPENDNA_AUTH_REQUIRED:-0}
      - OPENDNA_PUBLIC_DEMO=${OPENDNA_PUBLIC_DEMO:-1}
      - HF_HOME=/data/hf
    volumes:
      - opendna-data:/data
    expose:
      - "8765"
    # GPU passthrough (uncomment on a CUDA host)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - opendna
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./rate_limit.caddy:/etc/caddy/rate_limit.caddy:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  opendna-data:
  caddy-data:
  caddy-config:
